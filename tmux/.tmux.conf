# 传统 prefix，不冲突且与 Claude Code (C-l=清屏) 兼容
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# C-l 透传给终端清屏
# bind -n C-l send-keys C-l

# ==========================================
# 解决冲突与 macOS 优化 (关键修改)
# ==========================================

# -r 表示可重复按键 (例如: C-a, 然后按住 J 可以一直向下扩展)
# 按住重复即可快速移动，1 单位精确控制
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1
# 按住 Shift 快捷跳到最大
bind -r H resize-pane -L 30
bind -r J resize-pane -D 30
bind -r K resize-pane -U 30
bind -r L resize-pane -R 30
# = 最大化/还原当前 pane
bind = resize-pane -Z
bind -r m resize-pane -Z

# 使用 Alt/Option + 方向键 (hjkl) 直接切换面板 (Root Mode)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 2. 快速重载配置文件 (快捷键: C-a + r)
bind r source-file ~/.tmux.conf \; display "配置已重载!"

# 4. 保持当前路径 (新建面板/窗口时)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 4. macOS 剪贴板优化 (开启 Vi 模式)
set-window-option -g mode-keys vi
# 允许在复制模式下使用 v 进行选择，y 进行复制 (类似 Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# 基础设置 
# ==========================================

set -g mouse on
set -g base-index 1
setw -g monitor-activity on
set -g renumber-windows on

# 增加显示面板数字的时间 (单位：毫秒)
set -g display-panes-time 3000

unbind '"'
unbind %

# 释放 C-方向键，避免与macos冲突
unbind-key C-Up
unbind-key C-Down
unbind-key C-Left
unbind-key C-Right


# Claude Code 兼容 — Shift+Enter 换行 + 桌面通知
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 性能优化：减少 Esc 键延迟 (Ghostty 对 escape 处理快，10ms 足够)
set -s escape-time 10

# ==========================================
# 视觉与终端设置
# ==========================================

# Ghostty 原生支持真彩色 + 斜体 + undercurl
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ==========================================
# 插件管理
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # Dracula 已自带 prefix 提示
# set -g @plugin 'tmux-plugins/tmux-continuum'          # restore 关着≈没用，手动 prefix + C-r 即可
# set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'dracula/tmux'

# # Tilish 设置
# set -g @tilish-default 'tiled'

# Dracula 设置
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-fahrenheit false
set -g @dracula-show-flags true
set -g @dracula-plugins "cpu-usage ram-usage time"

# Restore 设置
# set -g @continuum-restore 'off'   # 已卸 continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# 自动安装 TPM
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# ==========================================
# 应急与杂项
# ==========================================

# F12 临时透传所有按键到下层终端（SSH 嵌套时按一下）
bind -n F12 set -g prefix None \; set -g prefix2 None \; \
  display "🔓 Passthrough ON (F12 to exit)"
bind -T root F12 run 'tmux set -g prefix C-a; tmux set -g prefix2 None; tmux display "🔒 Passthrough OFF"'

# Initialize TMUX plugin manager
run -b '~/.tmux/plugins/tpm/tpm'
